# FoxRouters — full stack
# Usage:
#   cp .env.example .env    # then edit .env with real values
#
# Log backend is SQLite (lightweight — only Redis + gateway):
#   docker compose up -d --build
#
# Cloudflare Tunnel (quick mode, random *.trycloudflare.com URL):
#   docker compose --profile tunnel up -d
#   docker logs foxrouters-tunnel   # grep trycloudflare.com for the URL
# For a named tunnel with a custom domain, prefer ./tunnel.sh enable --named.
#
# The gateway waits for its dependencies to be healthy before starting.

networks:
  default:
    name: foxrouters-net

services:
  redis:
    image: redis:7-alpine
    container_name: foxrouters-redis
    ports:
      # Host-local only — public ingress via Cloudflare Tunnel, never 0.0.0.0
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  foxrouters:
    # Prefer GHCR image for production; `build` used when developing locally.
    build:
      context: .
      args:
        VERSION: v1.6.13
    image: ghcr.io/rilspratama/foxrouters:v1.6.13
    container_name: foxrouters
    ports:
      - "127.0.0.1:20130:20130"
    depends_on:
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Override host-oriented values from .env with container DNS names.
      REDIS_ADDR: redis:6379
      # Log backend is SQLite (default). LOG_BACKEND=clickhouse is deprecated
      # and falls back to sqlite with a warning.
      LOG_BACKEND: "sqlite"
      LOG_SQLITE_PATH: /var/lib/foxrouters/logs.db
      PORT: "20130"
      # CodeBuddy key selection strategy (rr|sticky|content-hash|hybrid).
      # Sticky (default) binds conversations to one account for prompt-cache
      # locality. Runtime switchable via PUT /cb/selector-mode (Redis-persisted).
      CB_SELECTOR_MODE: "${CB_SELECTOR_MODE:-sticky}"
      # Turnstile solver lives on the HOST (PM2/bun, port 8742) — reach it via
      # host.docker.internal (host-gateway). Overridable in the Settings page.
      TURNSTILE_SOLVER_URL: "${TURNSTILE_SOLVER_URL:-http://host.docker.internal:8742/cloudflare}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Persist the sqlite log DB (only used in the default sqlite backend).
      # Safe to keep mounted even when running ClickHouse mode — the gateway
      # only touches this file when LOG_BACKEND=sqlite.
      - sqlite-data:/var/lib/foxrouters
    restart: unless-stopped

  # Cloudflare Tunnel — only starts when the `tunnel` profile is activated
  # (docker compose --profile tunnel up …). Quick mode gives a random
  # *.trycloudflare.com URL (no domain / no login needed); URL changes on
  # every restart. For a persistent custom domain use ./tunnel.sh enable
  # --named after preparing /etc/foxrouters/cloudflared/{cert.pem,config.yml,<id>.json}.
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: foxrouters-tunnel
    profiles: ["tunnel"]
    depends_on:
      - foxrouters
    command: tunnel --no-autoupdate --url http://foxrouters:20130
    restart: unless-stopped

volumes:
  redis-data:
  sqlite-data:
