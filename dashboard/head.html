<style>
/* ──────────────────────────────────────────────────────────
   Design System: MoonCalendar (21st.dev) — monochrome dark
   Backgrounds: #000000 (page), #171717 (panel), #1f1f1f (elevated)
   Text: #ffffff, #b3b3b3, #8c8c8c, #5c5c5c
   Brand: white (monochrome) — functional status colors only
   Borders: #2a2a2a — luminance stepping for elevation
   Fonts: Geist / Geist Mono (fallback Inter/system)
   ────────────────────────────────────────────────────────── */
:root {
  /* Backgrounds — MoonCalendar monochrome (pure black + grey steps) */
  --bg:           #000000;
  --bg-panel:     #171717;
  --bg-elevated:  #1f1f1f;
  --bg-hover:     rgba(255,255,255,0.05);
  --bg-input:     #171717;

  /* Text */
  --text-primary:    #ffffff;
  --text-secondary:  #b3b3b3;
  --text-tertiary:   #9c9c9c;
  --text-quaternary: #6b6b6b;

  /* Brand — monochrome white */
  --brand:       #ffffff;
  --brand-hover: rgba(255,255,255,0.82);
  --brand-violet:#ffffff;
  --brand-bg:    rgba(255,255,255,0.08);
  --brand-subtle:rgba(255,255,255,0.14);

  /* Borders */
  --border:        #2a2a2a;
  --border-strong: rgba(255,255,255,0.12);
  --border-bright: rgba(255,255,255,0.20);
  --border-muted:  #242424;

  /* Status — functional, restrained on monochrome */
  --green:   #4ade80;
  --emerald: #34d399;
  --green-subtle: rgba(74,222,128,0.12);
  --red:     #f87171;
  --red-subtle:   rgba(248,113,113,0.12);
  --orange:  #fbbf24;
  --yellow:  #fbbf24;
  --yellow-subtle:rgba(251,191,36,0.12);

  /* Radius — MoonCalendar 0.375rem */
  --radius:    6px;
  --radius-sm: 4px;
  --radius-xs: 3px;
  --radius-lg: 10px;

  /* Shadows — subtle elevation on black */
  --shadow-card:   0 1px 3px rgba(0,0,0,0.5);
  --shadow-hover:  0 4px 12px rgba(0,0,0,0.55);
  --shadow-modal:  0 8px 32px rgba(0,0,0,0.7);

  /* Spacing scale (4px base) */
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;
  --sp-5: 20px; --sp-6: 24px; --sp-8: 32px; --sp-10: 40px; --sp-12: 48px;

  /* Typography — Geist (MoonCalendar) */
  --font: 'Geist', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --mono: 'Geist Mono', 'JetBrains Mono', 'Fira Code', 'SF Mono', Menlo, monospace;

  /* Transitions */
  --tc: 150ms ease;
  --tt: 200ms ease;
}

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text-primary);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  font-feature-settings: "cv01", "ss03";
  font-weight: 400;
  line-height: 1.5;
  display: flex;
  min-height: 100vh;
}

/* ── Scrollbar ── */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.14); }

/* ══════════════════════════════════════════════════════════
   SIDEBAR
   ══════════════════════════════════════════════════════════ */
.sidebar {
  width: 220px;
  min-height: 100vh;
  background: var(--bg-panel);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  position: sticky;
  top: 0;
  height: 100vh;
}

.sidebar-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 18px 18px 16px;
}

.sidebar-brand .logo {
  width: 28px;
  height: 28px;
  border-radius: var(--radius-sm);
  background: transparent;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  border: 1px solid rgba(255,255,255,0.08);
  overflow: hidden;
}

.sidebar-brand .title {
  font-size: 15px;
  font-weight: 590;
  letter-spacing: -0.01em;
  color: var(--text-primary);
}

.sidebar-brand .version {
  font-size: 11px;
  font-family: var(--mono);
  color: var(--text-quaternary);
  padding: 1px 6px;
  border: 1px solid var(--border-strong);
  border-radius: 9999px;
  margin-left: auto;
}

.sidebar-nav {
  padding: 8px 10px;
  display: flex;
  flex-direction: column;
  gap: 2px;
  flex: 1;
}

.nav-section-label {
  font-size: 11px;
  font-weight: 500;
  color: var(--text-quaternary);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 12px 10px 6px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 10px;
  border-radius: var(--radius-sm);
  font-size: 13.5px;
  font-weight: 510;
  color: var(--text-tertiary);
  cursor: pointer;
  transition: background 150ms ease, color 150ms ease;
  text-decoration: none;
  border: none;
  background: none;
  width: 100%;
  text-align: left;
  font-family: var(--font);
}

.nav-item:hover {
  background: var(--bg-hover);
  color: var(--text-secondary);
}

.nav-item.active {
  background: rgba(255,255,255,0.08);
  color: var(--text-primary);
}

.nav-item svg {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
  opacity: 0.7;
}

.nav-item.active svg { opacity: 1; }

/* ── Sidebar collapse (icon rail) ── */
.sidebar { transition: width 200ms ease; }
.sidebar.collapsed { width: 60px; }
.sidebar.collapsed .sidebar-brand { justify-content: center; padding: 18px 0 16px; }
.sidebar.collapsed .sidebar-brand .title,
.sidebar.collapsed .sidebar-brand .version,
.sidebar.collapsed .nav-section-label,
.sidebar.collapsed .nav-item span,
.sidebar.collapsed .sidebar-footer { display: none; }
.sidebar.collapsed .nav-item { font-size: 0; gap: 0; justify-content: center; padding: 7px 0; }
.sidebar.collapsed .nav-item svg { width: 18px; height: 18px; }
.sidebar-toggle {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-secondary);
  cursor: pointer;
  flex-shrink: 0;
}
.sidebar-toggle:hover { border-color: var(--border-bright); color: var(--text-primary); }
.sidebar-toggle svg { width: 16px; height: 16px; }

.sidebar-footer {
  padding: 12px 18px;
  border-top: 1px solid var(--border);
  font-size: 11px;
  color: var(--text-quaternary);
  font-family: var(--mono);
}

.sidebar-footer .status-row {
  display: flex;
  align-items: center;
  gap: 6px;
}

.sidebar-footer .status-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--green);
}

.sidebar-footer .status-dot.err { background: var(--red); }

/* ══════════════════════════════════════════════════════════
   MAIN CONTENT
   ══════════════════════════════════════════════════════════ */
.main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.topbar {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 28px;
  border-bottom: 1px solid var(--border);
  background: var(--bg-panel);
  min-height: 52px;
}

.topbar-title {
  font-size: 16px;
  font-weight: 590;
  letter-spacing: -0.01em;
}

.topbar-spacer { flex: 1; }

.topbar-meta {
  font-size: 12px;
  color: var(--text-tertiary);
  font-family: var(--mono);
  display: flex;
  align-items: center;
  gap: 8px;
}

.topbar-meta .pulse-dot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--green);
  animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.4; } }

.content {
  padding: 24px 28px;
  flex: 1;
  max-width: 1600px;
  width: 100%;
}

/* ── Pages ── */
.page { display: none; }
.page.active { display: block; }

/* ── Stats Grid ── */
.stats-grid {
  display: block;
  margin-bottom: 8px;
}

/* Per-section sub-grid: auto-fit collapses empty tracks so each
   section's cards stretch to fill the full row width (fixes empty
   space on the right when a section has < track-count cards). */
.stats-cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 8px;
}

.stats-section {
  font-size: 10px;
  font-weight: 600;
  color: var(--text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin: 14px 0 6px;
}

.stats-section:first-child { margin-top: 0; }

.stat-card {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 14px;
  transition: border-color var(--tc), box-shadow var(--tc), transform var(--tt);
  box-shadow: var(--shadow-card);
}

.stat-card:hover {
  border-color: var(--border-bright);
  box-shadow: var(--shadow-hover);
  transform: translateY(-1px);
}

.stat-card .stat-label {
  font-size: 10px;
  font-weight: 500;
  color: var(--text-tertiary);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin-bottom: 4px;
}

.stat-card .stat-value {
  font-family: var(--mono);
  font-size: 19px;
  font-weight: 600;
  letter-spacing: -0.02em;
  font-feature-settings: "tnum";
  color: var(--text-primary);
  line-height: 1.2;
}

.stat-card .stat-sub {
  font-size: 11px;
  color: var(--text-tertiary);
  margin-top: 2px;
}

.stat-card .stat-sub .ok { color: var(--green); }
.stat-card .stat-sub .err { color: var(--red); }
.stat-card .stat-sub .warn { color: var(--orange); }

/* Card-5 style: value + inline delta (21st.dev Statistic Card 5) */
.stat-value-row {
  display: flex;
  align-items: baseline;
  gap: 6px;
  line-height: 1.2;
}
.stat-delta {
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
}
.stat-delta.ok   { color: var(--green); }
.stat-delta.warn { color: var(--orange); }
.stat-delta.err  { color: var(--red); }

/* Segmented quota bar (Card 5 segmented progress bar) */
.stat-bar {
  display: flex;
  gap: 2px;
  height: 8px;
  margin-top: 10px;
  border-radius: 2px;
  overflow: hidden;
  background: rgba(255,255,255,0.06);
}
.stat-bar-seg {
  height: 100%;
  border-radius: 1px;
  transition: width 300ms ease;
}
.stat-bar-seg.used { background: var(--green); }
.stat-bar-seg.used.warn { background: var(--orange); }
.stat-bar-seg.used.err  { background: var(--red); }
.stat-bar-seg.rest { background: rgba(255,255,255,0.14); }
.stat-bar-seg.neutral { background: rgba(255,255,255,0.85); }

/* ── Circuit Badge (pill) ── */
.circuit-badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  font-weight: 510;
  padding: 2px 8px;
  border-radius: 9999px;
  border: 1px solid var(--border-strong);
  background: transparent;
  font-family: var(--mono);
  text-transform: uppercase;
  letter-spacing: 0.03em;
}

.circuit-badge::before {
  content: '';
  width: 5px;
  height: 5px;
  border-radius: 50%;
}

.circuit-closed::before { background: var(--green); }
.circuit-closed { color: var(--green); border-color: rgba(39,166,68,0.2); }

.circuit-open::before { background: var(--red); }
.circuit-open { color: var(--red); border-color: rgba(239,68,68,0.2); }

.circuit-half-open::before { background: var(--orange); }
.circuit-half-open { color: var(--orange); border-color: rgba(245,158,11,0.2); }

/* ── Status Dot ── */
.sdot {
  width: 6px;
  height: 6px;
  border-radius: 50%;
  display: inline-block;
}
.sdot-ok { background: var(--green); }
.sdot-err { background: var(--red); }

/* ── Cards / Panels ── */
.panel {
  background: var(--bg-panel);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  margin-bottom: 16px;
  overflow: hidden;
  box-shadow: var(--shadow-card);
}

.panel-head {
  padding: 12px 16px;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 8px;
}

.panel-head h3 {
  font-size: 13px;
  font-weight: 590;
  letter-spacing: -0.01em;
  color: var(--text-primary);
}

.panel-head svg {
  width: 15px;
  height: 15px;
  color: var(--text-tertiary);
}

.panel-head .head-meta {
  margin-left: auto;
  font-size: 11.5px;
  color: var(--text-tertiary);
  font-family: var(--mono);
}

.panel-body { padding: 0; }

/* ── Table ── */
.tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }

.tbl th {
  text-align: left;
  padding: 10px 16px;
  color: var(--text-tertiary);
  font-weight: 600;
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  border-bottom: 1px solid var(--border);
  white-space: nowrap;
  background: var(--bg-elevated);
}

.tbl td {
  padding: 10px 16px;
  border-bottom: 1px solid var(--border-muted);
  color: var(--text-secondary);
}

.tbl tr:last-child td { border-bottom: none; }
.tbl tr { transition: background var(--tc); }
.tbl tbody tr:hover { background: var(--bg-hover); }

.mono { font-family: var(--mono); font-size: 11.5px; }
.muted { color: var(--text-tertiary); }
.ok { color: var(--green); }
.err { color: var(--red); }
.warn { color: var(--orange); }

/* ── Scrollable table container ── */
.tbl-scroll { max-height: 420px; overflow-y: auto; }
.tbl-scroll thead { position: sticky; top: 0; background: var(--bg-elevated); z-index: 1; }

/* ── Progress bar ── */
.pbar {
  width: 80px;
  height: 4px;
  background: rgba(255,255,255,0.06);
  border-radius: 2px;
  overflow: hidden;
  display: inline-block;
  vertical-align: middle;
  margin-right: 6px;
}

.pbar-fill { height: 100%; border-radius: 2px; transition: width 0.4s ease; }
.pbar-green { background: var(--green); }
.pbar-orange { background: var(--orange); }
.pbar-red { background: var(--red); }

/* ── Sub-tabs ── */
.subtabs {
  display: flex;
  gap: 2px;
  padding: 8px 12px;
  border-bottom: 1px solid var(--border);
}

.subtab {
  padding: 5px 12px;
  font-size: 12.5px;
  font-weight: 510;
  color: var(--text-tertiary);
  cursor: pointer;
  border-radius: var(--radius-xs);
  transition: all 120ms ease;
  border: none;
  background: none;
  font-family: var(--font);
}

.subtab:hover { color: var(--text-secondary); background: var(--bg-hover); }
.subtab.active { color: var(--text-primary); background: var(--bg-elevated); box-shadow: inset 0 0 0 1px var(--border); }

/* ── Quick Test ── */
.test-row {
  display: flex;
  gap: 8px;
  padding: 12px 16px;
  align-items: center;
  flex-wrap: wrap;
}

.test-row select,
.test-row input {
  background: var(--bg-elevated);
  border: 1px solid var(--border-strong);
  color: var(--text-primary);
  border-radius: var(--radius-sm);
  padding: 7px 12px;
  font-size: 13px;
