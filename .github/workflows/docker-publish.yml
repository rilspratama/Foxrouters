name: Build and Push Docker Image to ghcr.io

on:
  # Triggered by release-binaries.yml after GoReleaser attaches binaries,
  # so the image downloads the prebuilt binary (fast) instead of compiling.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build image from (e.g. v1.6.14)"
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.tag }}
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=FoxRouters
            org.opencontainers.image.description=OpenAI-compatible AI Gateway for Grok + CodeBuddy
            org.opencontainers.image.licenses=MIT

      - name: Compute release version (GoReleaser strips the v prefix)
        run: echo "RELEASE_VER=${TAG#v}" >> "$GITHUB_ENV"
        env:
          TAG: ${{ inputs.tag }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ inputs.tag }}
            RELEASE_BASE_URL=https://github.com/${{ github.repository }}/releases/download/${{ inputs.tag }}/foxrouters_${{ env.RELEASE_VER }}_linux
          cache-from: type=gha
          cache-to: type=gha,mode=max
